server:
  host: "0.0.0.0"
  port: 4444
  log_level: info

providers:
  - name: anthropic
    api_base: "https://api.anthropic.com"
    models:
      - model_id: claude-sonnet-4-6
        display_name: sonnet
        tier: standard
        supports_tools: true
        supports_json_mode: true
        max_context_tokens: 1000000
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
      - model_id: claude-haiku-4-5-20251001
        display_name: haiku
        tier: economy
        supports_tools: true
        supports_json_mode: true
        max_context_tokens: 200000
        cost_per_1k_input: 0.001
        cost_per_1k_output: 0.005
  - name: openai
    api_base: "https://api.openai.com/v1"
    models:
      - model_id: gpt-4o-mini
        display_name: gpt-4o-mini
        tier: economy
        supports_tools: true
        supports_json_mode: true
        max_context_tokens: 128000
        cost_per_1k_input: 0.00015
        cost_per_1k_output: 0.0006
  # In Docker: use http://host.docker.internal:11434
  # On host: use http://localhost:11434
  - name: ollama
    api_base: "http://host.docker.internal:11434"
    models:
      - model_id: qwen2.5:7b
        display_name: qwen2.5:7b
        tier: economy
        supports_tools: false
        max_context_tokens: 32768

sources:
  default:
    minimum_tier: economy
    requires_tools: false
    allowed_providers: [anthropic, openai, ollama]
  critical:
    minimum_tier: standard
    requires_tools: true
    allowed_providers: [anthropic]

routing:
  default_determinism_target: 0.7
  min_empirical_runs: 10

compression:
  enabled: true
  default_tier: medium  # light | medium | heavy | extreme
  tool_results: true    # compress text inside tool_result blocks
                        # (structure always preserved; tool_use never touched)
  # Optional LLM prose summarization (default: fully local/extractive, no
  # model calls). Any LLM failure falls back to extractive silently.
  # llm_prose: true
  # llm_url: http://localhost:11434   # Ollama; append /v1 for OpenAI-compatible
  # llm_model: qwen2.5:7b
  # llm_timeout_seconds: 30
  # Optional compressed-variant store (pip install 'loom-gateway[neo4j]'):
  # preserves pre-compression originals for pointer resolution, and content
  # indexed in the graph by a context engine is compressed less aggressively.
  # variant_store: neo4j
  # neo4j_uri: bolt://localhost:7687   # or env LOOM_NEO4J_URI
  # neo4j_user: neo4j                  # or env LOOM_NEO4J_USER
  # neo4j_password: ""                 # or env LOOM_NEO4J_PASSWORD

storage:
  backend: sqlite            # sqlite (default) | postgres
  database_path: data/loom.db
  # For backend: postgres — install extras (pip install 'loom-gateway[postgres]')
  # and provide a DSN here or via the LOOM_POSTGRES_DSN environment variable:
  # postgres_dsn: postgresql://user:pass@localhost:5432/loom

observability:
  audit_log_path: logs/audit.jsonl
  metrics_log_path: logs/metrics.jsonl
