services:
  loom:
    build:
      context: .
      args:
        INSTALL_EXTRAS: "postgres"
    ports:
      - "4444:4444"
    volumes:
      - ./loom.homelab.yaml:/app/loom.yaml:ro
      - loom-data:/app/data
      - loom-logs:/app/logs
    env_file:
      - .env.homelab
    environment:
      LOOM_CONFIG: /app/loom.yaml
      LOOM_POSTGRES_DSN: "postgresql://n8n@postgres-unified:5432/loom"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - n8n_n8n-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
        reservations:
          memory: 128M
    restart: unless-stopped

networks:
  n8n_n8n-network:
    external: true

volumes:
  loom-data:
  loom-logs:
