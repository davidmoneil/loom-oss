name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: loom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Lint (errors only)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 src tests
      - name: Test (SQLite + Postgres backends)
        env:
          LOOM_TEST_POSTGRES_DSN: postgresql://postgres:loom@localhost:5432/postgres
        run: pytest -q

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml resolves on a fresh clone
        run: |
          cp loom.example.yaml loom.yaml
          docker compose config --quiet

  security-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --upgrade pip setuptools
          pip install -e .
      - name: Audit Python dependencies (fail on any known vulnerability)
        run: |
          pip install pip-audit
          pip-audit

  security-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit dashboard dependencies (fail on high/critical)
        working-directory: dashboard
        run: |
          npm ci
          npm audit --audit-level=high
