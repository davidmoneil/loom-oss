services:
  loom:
    build:
      context: .
      args:
        # setup.sh sets this to "postgres" in .env when a Postgres backend
        # is selected, so psycopg + cryptography get baked into the image.
        INSTALL_EXTRAS: ${LOOM_INSTALL_EXTRAS:-}
    ports:
      - "${LOOM_PORT:-4444}:4444"
    volumes:
      - ./loom.yaml:/app/loom.yaml:ro
      - loom-data:/app/data
      - loom-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      LOOM_CONFIG: /app/loom.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
        reservations:
          memory: 128M
    restart: unless-stopped

  # Optional laya shadow-mode sidecar — enabled with the "laya" profile
  # (COMPOSE_PROFILES=laya). Off by default: loom.laya_shadow.enabled must
  # also be set to true and pointed at this service (laya_shadow.url) for
  # the gateway to call it. Its own container, its own restart lifecycle —
  # never loaded into the loom process. See services/laya-sidecar/README.md.
  laya-sidecar:
    build:
      context: services/laya-sidecar
    profiles: ["laya"]
    ports:
      - "${LAYA_SIDECAR_PORT:-8091}:8091"
    environment:
      LAYA_SIDECAR_DEVICE: ${LAYA_SIDECAR_DEVICE:-cpu}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  # Optional bundled database — enabled with the "postgres" profile
  # (COMPOSE_PROFILES=postgres, written to .env by setup.sh).
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      # setup.sh generates this; the postgres image refuses to start empty.
      POSTGRES_PASSWORD: ${LOOM_PG_PASSWORD:-}
    volumes:
      - loom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  loom-data:
  loom-logs:
  loom-pgdata:
